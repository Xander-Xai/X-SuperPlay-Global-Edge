name: x-superplay-global-edge-observation

services:
  edge-health-api:
    build:
      context: ../..
      dockerfile: services/edge-health-api/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${EDGE_OBSERVATION_EVIDENCE_ROOT:?EDGE_OBSERVATION_EVIDENCE_ROOT is required}
        target: /data/evidence
        read_only: true
      - type: bind
        source: ${EDGE_OBSERVATION_IDENTITY_CONFIG:?EDGE_OBSERVATION_IDENTITY_CONFIG is required}
        target: /run/x-superplay/node.yaml
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/api/v1/node/metadata', timeout=2).read()
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
